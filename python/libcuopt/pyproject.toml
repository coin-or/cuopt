[build-system]
build-backend = "rapids_build_backend.build"
requires = [
    "rapids-build-backend>=0.4.0,<0.5.0",
    "scikit-build-core[pyproject]>=0.11.0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project]
name = "libcuopt"
dynamic = ["version"]
description = "cuOpt - GPU Optimizer (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "NVIDIA Corporation" },
]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Programming Language :: C++",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "libcuopt-client==26.10.*,>=0.0.0a0",
    "libcuopt-mathopt==26.10.*,>=0.0.0a0",
    "libcuopt-routing==26.10.*,>=0.0.0a0",
    "librmm==26.10.*,>=0.0.0a0",
    "rapids-logger==0.3.*",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.

[project.urls]
Homepage = "https://docs.nvidia.com/cuopt/introduction.html"
Source = "https://github.com/nvidia/cuopt"

[project.entry-points."cmake.prefix"]
libcuopt = "libcuopt"

[project.scripts]
cuopt_grpc_server = "libcuopt._grpc_server_wrapper:main"

[tool.pydistcheck]
select = [
    # note: max_allowed_size_compressed is set as a command-line arg
    "distro-too-large-compressed",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = false
sdist.reproducible = true
wheel.packages = ["libcuopt"]
wheel.install-dir = "libcuopt"
wheel.py-api = "py3"
# libcuopt is a thin metapackage: the client/mathopt/routing engine libraries now come
# from their own wheels (find_package(cuopt) resolves them via the component wheels'
# CMake config, since #1635 gave each its own export set / _IMPORT_PREFIX). "dev" is the
# linker script, "cuopt" is rapids_export's own component (cuopt-config.cmake + the
# umbrella export set) -- the same two components the conda libcuopt metapackage
# installs (conda/recipes/libcuopt/recipe.yaml). "grpc-server" is added because wheels
# have no separate cuopt-grpc-server package the way conda does.
#
# "Unspecified" (CMake's default component name for install() calls with no COMPONENT)
# must be included too: rapids-cmake writes self-contained "found package" redirects for
# CPM-fetched CCCL (lib64/rapids/cmake/{cub,libcudacxx,cccl}/*.cmake) with no COMPONENT.
# Without them here, cuopt-config.cmake's find_dependency(rmm) falls through to
# libcuopt-rmm's own bundled copy of those redirects instead of a self-consistent one
# installed alongside cuopt-config.cmake, which hits a CCCL find_package ordering bug
# (cub-config.cmake calls a function libcudacxx-config.cmake defines, but CMake's
# found-package caching can skip re-processing libcudacxx from that same copy). See #2013.
install.components = ["dev", "cuopt", "grpc-server", "Unspecified"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libcuopt/VERSION"
regex = "(?P<value>.*)"

[tool.rapids-build-backend]
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true;use_cuda_wheels=true"
requires = [
    "cmake>=4.0",
    "librmm==26.10.*,>=0.0.0a0",
    "ninja",
    "rapids-logger==0.3.*",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
