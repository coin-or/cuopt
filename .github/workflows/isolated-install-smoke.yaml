# Install each cuOpt component (client / mathopt / routing) on its own from the nightly
# wheel and conda channels and build + run a small gtest against it. See
# ci/isolated_install/README.md. Non-blocking: scheduled and manual only.

name: Isolated install smoke

on:
  schedule:
    - cron: "0 7 * * *" # 7am UTC, after the 5am nightly build/test pipeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-install:
    name: ${{ matrix.component }} (${{ matrix.source }})
    # client needs no GPU; mathopt and routing need one. Same GPU runner label as test_images.yaml.
    runs-on: ${{ matrix.component == 'client' && 'ubuntu-latest' || 'linux-amd64-gpu-a100-latest-1' }}
    timeout-minutes: 60
    # Known to fail until the packaging fixes land; drop this once they have merged.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        component: [client, mathopt, routing]
        source: [pip, conda]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install ${{ matrix.component }} from ${{ matrix.source }} and run its gtest
        env:
          COMPONENT: ${{ matrix.component }}
          SOURCE: ${{ matrix.source }}
        run: bash ci/isolated_install/run.sh "${COMPONENT}" "${SOURCE}"
