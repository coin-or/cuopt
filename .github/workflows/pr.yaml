  java-static-build-matrix:
    needs: changed-files
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    if: >-
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_java ||
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    with:
      build_type: pull-request
      matrix_name: conda-cpp-build
      matrix_filter: 'map(. + {CUDA_MAJOR: (.CUDA_VER | split(".") | .[0])}) | unique_by([.ARCH, .CUDA_MAJOR]) | map(select(.ARCH == "amd64"))'
  java-static-build:
    needs: [java-static-build-matrix, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.java-static-build-matrix.outputs.matrix) }}
    if: >-
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_java ||
      fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    with:
      build_type: pull-request
      node_type: "cpu16"
      arch: ${{ matrix.ARCH }}
      # ci-wheel (Rocky 8) rather than ci-conda: gcc-toolset-14 on Rocky 8 produces a libstdc++
      # ABI requirement the RAPIDS-supported platforms can actually satisfy, unlike ci-conda's
      # gcc_linux-64 conda package -- the same fix cuDF applied in rapidsai/cudf#23766 after
      # hitting this in production (rapidsai/cudf#23753). See setup_java_static_env.sh.
      #
      # Must be CUDA-version-pinned, not the bare "26.10-latest" tag: custom-job.yaml has no
      # per-matrix env passthrough, so an untagged image would leave RAPIDS_CUDA_VERSION at
      # that image's single baked-in default for every matrix entry.
      # ci/build_java_static.sh reads it to pick the CUDA toolkit, so every "cuN" classifier
      # JAR would actually be built against the same CUDA version and just mislabeled. Matches
      # the pattern java-static-test (test.yaml) already uses for this image family.
      container_image: "rapidsai/ci-wheel:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/build_java_static.sh"
      artifact-name: "cuopt_java_${{ matrix.ARCH }}_cu${{ matrix.CUDA_MAJOR }}"
      file_to_upload: "java/cuopt/classifier-jars/"

  # Runs the full Java suite against each classifier JAR on a GPU, with no libcuopt installed,
  # so a JAR that loads but computes wrong answers fails here rather than at a user.
  # TEMP: exercise the Publisher API path on a PR build. Remove before merge.
  java-static-gather:
    needs: [java-static-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
    steps:
      - name: Checkout code repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Download per-classifier JAR artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cuopt_java_*
          path: ${{ runner.temp }}/jars
          merge-multiple: true
      - name: Assemble Maven repository layout
        run: |
          ./java/cuopt/ci/assemble_maven_repo.sh \
            --jars-dir "${RUNNER_TEMP}/jars" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload combined Maven repository artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cuopt_java_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error

  java-maven-publish:
    needs: [java-static-gather]
    runs-on: linux-amd64-cpu4
    permissions:
      actions: read
      contents: read
    steps:
      # TEMP: runs the scripts from rapidsai/shared-workflows#668 directly.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: rapidsai/shared-workflows
          ref: b9f46fccd7f1459702e6b2779f19b4d6b9379b21
          path: shared-workflows
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cuopt_java_maven_repo
          path: maven-repo
      - name: Prepare signed Maven bundle
        id: prepare
        run: |
          shared-workflows/ci/maven-publish/prepare_maven_bundle.sh \
            --input maven-repo \
            --output signed-maven-repo
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Upload to Maven Central, then drop
        run: |
          shared-workflows/ci/maven-publish/maven_central_publish.sh \
            --input signed-maven-repo \
            --group-id "${GROUP_ID}" \
            --artifact-id "${ARTIFACT_ID}" \
            --version "${VERSION}" \
            --output-bundle central-bundle.zip \
            --auto-drop true
        env:
          GROUP_ID: ${{ steps.prepare.outputs.GROUP_ID }}
          ARTIFACT_ID: ${{ steps.prepare.outputs.ARTIFACT_ID }}
          VERSION: ${{ steps.prepare.outputs.VERSION }}
          MAVEN_DEPLOY_USERNAME: ${{ vars.MAVEN_DEPLOY_USERNAME }}
          MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
